<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="IPAexGothic, 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'BIZ UDPGothic', sans-serif">
  <title>P4（Tab5）と S3（CoreS3）の推論速度の差</title>
  <rect width="1400" height="820" fill="#fcfcfb"/>

  <text x="60" y="70" font-size="32" font-weight="700" fill="#0b0b0b">なぜ CoreS3（ESP32-S3）は Tab5（ESP32-P4）より 3.4 倍遅いのか</text>
  <text x="60" y="104" font-size="16" fill="#52514e">pico-faces 既定モデル、K=4 cfg w=4、PIE あり、2 コア。1 枚の生成時間の実測</text>

  <!-- 大きな数字 -->
  <g>
    <rect x="60" y="140" width="16" height="64" fill="#2a78d6"/>
    <text x="92" y="168" font-size="20" fill="#52514e">Tab5（ESP32-P4 360 MHz）</text>
    <text x="92" y="204" font-size="34" font-weight="700" fill="#0b0b0b">2.0 秒</text>
    <rect x="520" y="140" width="16" height="64" fill="#eb6834"/>
    <text x="552" y="168" font-size="20" fill="#52514e">CoreS3（ESP32-S3 240 MHz）</text>
    <text x="552" y="204" font-size="34" font-weight="700" fill="#0b0b0b">6.9 秒</text>
    <text x="1000" y="168" font-size="20" fill="#52514e">差</text>
    <text x="1000" y="204" font-size="34" font-weight="700" fill="#0b0b0b">3.4 倍</text>
  </g>

  <!-- 内訳（積み上げ棒。1 s = 160 px、原点 x=200） -->
  <text x="60" y="262" font-size="18" font-weight="700" fill="#0b0b0b">時間の内訳 [秒]</text>
  <g font-size="12" fill="#52514e">
    <rect x="220" y="250" width="14" height="14" fill="#2a78d6"/><text x="240" y="262">DiT（行列積・attention）</text>
    <rect x="430" y="250" width="14" height="14" fill="#2a78d6" fill-opacity="0.55"/><text x="450" y="262">重みの転送</text>
    <rect x="560" y="250" width="14" height="14" fill="#2a78d6" fill-opacity="0.3"/><text x="580" y="262">VAE デコーダ</text>
    <rect x="700" y="250" width="14" height="14" fill="#d9d9d5"/><text x="720" y="262">その他</text>
  </g>
  <!-- Tab5: DiT 1.34, stage 0.15, VAE 0.50, other 0.03 -->
  <text x="184" y="303" font-size="15" fill="#0b0b0b" text-anchor="end">Tab5</text>
  <rect x="200" y="284" width="214" height="28" fill="#2a78d6"/>
  <rect x="416" y="284" width="22" height="28" fill="#2a78d6" fill-opacity="0.55"/>
  <rect x="440" y="284" width="78" height="28" fill="#2a78d6" fill-opacity="0.3"/>
  <rect x="520" y="284" width="4" height="28" fill="#d9d9d5"/>
  <text x="532" y="303" font-size="14" fill="#0b0b0b">2.02 s（DiT 1.34 / 転送 0.15 / VAE 0.50）</text>
  <!-- CoreS3: DiT 2.94, stage 0.75, VAE 2.33, other 0.9 -->
  <text x="184" y="349" font-size="15" fill="#0b0b0b" text-anchor="end">CoreS3</text>
  <rect x="200" y="330" width="470" height="28" fill="#eb6834"/>
  <rect x="672" y="330" width="118" height="28" fill="#eb6834" fill-opacity="0.55"/>
  <rect x="792" y="330" width="371" height="28" fill="#eb6834" fill-opacity="0.3"/>
  <rect x="1165" y="330" width="142" height="28" fill="#d9d9d5"/>
  <text x="1315" y="349" font-size="14" fill="#0b0b0b">6.9 s</text>
  <text x="200" y="380" font-size="13" fill="#52514e">DiT 2.9（2.2 倍）／ 転送 0.75（5 倍）／ VAE 2.3（4.7 倍）／ その他 0.9</text>

  <!-- 原因 3 つ -->
  <text x="60" y="440" font-size="18" font-weight="700" fill="#0b0b0b">原因は 3 つ</text>
  <g font-size="16" fill="#0b0b0b">
    <rect x="60" y="460" width="1280" height="96" rx="8" fill="#ffffff" stroke="#e6e6e3"/>
    <text x="84" y="496" font-size="30" font-weight="700" fill="#0b0b0b">2×</text>
    <text x="160" y="490" font-weight="700" font-size="18">クロックと PIE の速さ</text>
    <text x="160" y="518" fill="#52514e">360 MHz vs 240 MHz で 1.5 倍、PIE 命令 1 個が 3.3 ns vs 4.3 ns で 1.3 倍。DiT の差（2.2 倍）はほぼこれで説明できる。</text>
    <text x="160" y="542" fill="#52514e" font-size="13">どちらの PIE も「1 命令 ≈ 1 サイクル、ロードと MAC は重ならない」なので、差は素の速さの差。</text>

    <rect x="60" y="572" width="1280" height="96" rx="8" fill="#ffffff" stroke="#e6e6e3"/>
    <text x="84" y="608" font-size="30" font-weight="700" fill="#0b0b0b">5×</text>
    <text x="160" y="602" font-weight="700" font-size="18">メモリが遅くて小さい</text>
    <text x="160" y="630" fill="#52514e">PSRAM は HEX 200 MHz vs Quad 80 MHz（帯域 約 10 倍）、キャッシュ 256 KB vs 64 KB、内部 SRAM 768 KB vs 340 KB。</text>
    <text x="160" y="654" fill="#52514e" font-size="13">重みの転送が 5 倍。活性と VAE の作業領域を PSRAM に置くしかなく、VAE と attention にも下駄が乗る。</text>

    <rect x="60" y="684" width="1280" height="96" rx="8" fill="#ffffff" stroke="#e6e6e3"/>
    <text x="84" y="720" font-size="30" font-weight="700" fill="#0b0b0b">2×</text>
    <text x="160" y="714" font-weight="700" font-size="18">S3 の QACC は 20 bit なので、疎な計算を密に置き換えた（計算量 2 倍）</text>
    <text x="160" y="742" fill="#52514e">P4 は 32 bit の QACC で疎な fc2 / VAE を非ゼロだけ拾える。S3 は ±2^19 で飽和するため、転置重みの密な内積に。</text>
    <text x="160" y="766" fill="#52514e" font-size="13">VAE 217M → 434M MAC、fc2 33k → 65k MAC/token。さらに 2 コア時のハザード回避で内積が 2 → 3 命令/16 MAC（+13%）。</text>
  </g>

  <text x="60" y="808" font-size="12" fill="#52514e">出典: nnn112358/pico-faces-tab5、nnn112358/pico-faces-M5CoreS3（2026-09-07 の実測。どちらも PIE なし / あり で画像は bit 一致）。縮められる余地は 3（20 bit で区切った疎な gather）と 2 の転送（GDMA）。</text>
</svg>
